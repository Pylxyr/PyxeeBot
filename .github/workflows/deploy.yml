name: Deploy Music Bot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends --fix-missing libsodium-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip "setuptools>=83.0.0"
          pip install -r requirements.txt ruff pip-audit

      - name: Lint
        run: ruff check musicbot/ bot.py

      - name: Auto-format with Ruff
        run: ruff format musicbot/ bot.py

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format python code with ruff"

      - name: Security audit
        run: pip-audit --ignore-vuln CVE-2025-69277

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            # This step assumes ~/musicbot is already a live checkout with a working
            # .venv, .env, and systemd unit (i.e. one of the deploy/setup_*.sh scripts
            # has been run there at least once). It only pulls new code onto an
            # existing install — it can't bootstrap a server from nothing, since that
            # needs a Discord token typed in interactively. If the directory is
            # missing (e.g. it was deleted), fail with a clear message instead of a
            # cryptic "No such file or directory" from `cd`.
            if [ ! -d ~/musicbot/.git ]; then
              echo "~/musicbot is missing or not a git checkout — nothing to deploy onto."
              echo "SSH in and run this once to reprovision it:"
              echo "  git clone https://github.com/${{ github.repository }}.git ~/musicbot"
              echo "  cd ~/musicbot"
              echo "  bash deploy/setup_oracle.sh   # on Oracle Cloud"
              echo "  bash deploy/setup_gcp.sh      # on Google Cloud"
              echo "  bash deploy/setup.sh          # anywhere else"
              exit 1
            fi
            cd ~/musicbot

            git fetch origin main

            # NB: data/ is already in .gitignore, so this is a no-op in normal use —
            # a former one-time fix for a commit predating that. Left out here since
            # `git reset --hard` below discards the staged removal anyway (nothing
            # commits it in between), so it never did anything on this path.

            git reset --hard origin/main

            if [ ! -x ~/musicbot/.venv/bin/pip ]; then
              echo "~/musicbot/.venv is missing — run the matching deploy/setup_*.sh script on the server first."
              exit 1
            fi
            ~/musicbot/.venv/bin/pip install --upgrade pip "setuptools>=83.0.0" -q
            ~/musicbot/.venv/bin/pip install -r requirements.txt -q

            sudo systemctl stop musicbot
            sudo systemctl daemon-reload
            sudo systemctl start musicbot

            for i in 1 2 3 4 5; do
              sleep 3
              systemctl is-active --quiet musicbot && break
              if [ $i -eq 5 ]; then
                journalctl -u musicbot -n 30 --no-pager
                exit 1
              fi
            done

            echo "Deployed: $(git rev-parse --short HEAD)"
